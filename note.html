<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOTEX — Premium Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0a0f;
    --surface: #12101a;
    --surface2: #1a1726;
    --surface3: #221f30;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --gold: #c9a96e;
    --gold2: #e8c98a;
    --gold3: #f5e2b3;
    --text: #e8e4f0;
    --text2: #a09cb8;
    --text3: #6b6680;
    --accent: #7c5cbf;
    --accent2: #9b7de0;
    --green: #5ecfb1;
    --red: #e06b6b;
    --blue: #6ba3e0;
    --glow: rgba(201,169,110,0.15);
    --shadow: 0 32px 80px rgba(0,0,0,0.6);
  }

  html { font-size: 15px; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
    display: flex;
  }

  /* Ambient BG */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(124,92,191,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 80%, rgba(201,169,110,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 40% 50% at 50% 50%, rgba(94,207,177,0.04) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }

  /* SIDEBAR */
  .sidebar {
    width: 260px; min-width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    position: relative; z-index: 10;
    backdrop-filter: blur(20px);
  }

  .logo {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem; font-weight: 600;
    letter-spacing: 0.12em;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold3) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .logo-sub {
    font-size: 0.65rem; color: var(--text3);
    letter-spacing: 0.3em; text-transform: uppercase;
    margin-top: 2px; font-weight: 300;
  }

  .sidebar-section { padding: 20px 16px 8px; }
  .section-label {
    font-size: 0.6rem; color: var(--text3); letter-spacing: 0.35em;
    text-transform: uppercase; font-weight: 500; padding: 0 8px 10px;
  }

  .new-note-btn {
    width: 100%; padding: 10px 14px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--accent2) 100%);
    border: none; border-radius: 10px;
    color: #0b0a0f; font-family: 'Outfit', sans-serif;
    font-weight: 600; font-size: 0.8rem; letter-spacing: 0.05em;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    margin-bottom: 16px; transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(201,169,110,0.25);
  }
  .new-note-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(201,169,110,0.4); }

  .filter-tabs { display: flex; gap: 6px; padding: 0 8px 14px; }
  .filter-tab {
    flex: 1; padding: 6px 4px; border: 1px solid var(--border);
    border-radius: 8px; background: transparent; color: var(--text3);
    font-family: 'Outfit', sans-serif; font-size: 0.65rem;
    letter-spacing: 0.05em; cursor: pointer; transition: all 0.2s;
    text-align: center;
  }
  .filter-tab.active, .filter-tab:hover {
    border-color: var(--gold); color: var(--gold); background: rgba(201,169,110,0.08);
  }

  .notes-list { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
  .notes-list::-webkit-scrollbar { width: 3px; }
  .notes-list::-webkit-scrollbar-track { background: transparent; }
  .notes-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .note-item {
    padding: 12px 14px; border-radius: 10px; cursor: pointer;
    margin-bottom: 4px; border: 1px solid transparent;
    transition: all 0.2s ease; position: relative;
    display: flex; flex-direction: column; gap: 4px;
  }
  .note-item:hover { background: var(--surface2); border-color: var(--border); }
  .note-item.active {
    background: var(--surface2); border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(201,169,110,0.1);
  }
  .note-item-tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase;
    font-weight: 500; padding: 2px 7px; border-radius: 20px;
    width: fit-content;
  }
  .tag-code { background: rgba(107,163,224,0.15); color: var(--blue); }
  .tag-normal { background: rgba(201,169,110,0.12); color: var(--gold); }
  .tag-idea { background: rgba(155,125,224,0.15); color: var(--accent2); }
  .tag-important { background: rgba(224,107,107,0.15); color: var(--red); }

  .note-item-title { font-size: 0.82rem; font-weight: 500; color: var(--text); line-height: 1.3; }
  .note-item-preview { font-size: 0.7rem; color: var(--text3); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-item-date { font-size: 0.62rem; color: var(--text3); margin-top: 2px; }

  .note-item .pin-icon {
    position: absolute; right: 10px; top: 10px;
    font-size: 0.7rem; color: var(--gold); opacity: 0;
  }
  .note-item.pinned .pin-icon { opacity: 1; }

  .sidebar-bottom {
    padding: 16px; border-top: 1px solid var(--border);
    display: flex; gap: 8px;
  }
  .sb-btn {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--text3); font-size: 1rem;
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
  }
  .sb-btn:hover { border-color: var(--gold); color: var(--gold); background: var(--glow); }

  .search-bar {
    margin: 0 8px 8px;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px;
  }
  .search-bar input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: 'Outfit', sans-serif;
    font-size: 0.75rem; placeholder-color: var(--text3);
  }
  .search-bar input::placeholder { color: var(--text3); }
  .search-icon { color: var(--text3); font-size: 0.8rem; }

  /* MAIN EDITOR */
  .main {
    flex: 1; display: flex; flex-direction: column;
    position: relative; z-index: 5; overflow: hidden;
  }

  .toolbar {
    display: flex; align-items: center; gap: 0;
    padding: 12px 24px; border-bottom: 1px solid var(--border);
    background: rgba(18,16,26,0.8); backdrop-filter: blur(20px);
    flex-wrap: wrap; gap: 8px;
  }
  .toolbar-group {
    display: flex; align-items: center; gap: 2px;
    padding: 0 12px 0 0; border-right: 1px solid var(--border);
    margin-right: 4px;
  }
  .toolbar-group:last-of-type { border-right: none; }
  .tool-btn {
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: var(--text2);
    border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    transition: all 0.15s; font-family: 'Outfit', sans-serif; font-weight: 600;
  }
  .tool-btn:hover { background: var(--surface3); color: var(--gold); }
  .tool-btn.active { background: rgba(201,169,110,0.15); color: var(--gold); }

  .mode-toggle {
    margin-left: auto;
    display: flex; align-items: center; gap: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 4px;
  }
  .mode-btn {
    padding: 5px 14px; border-radius: 7px; border: none;
    background: transparent; color: var(--text3); font-family: 'Outfit', sans-serif;
    font-size: 0.7rem; font-weight: 500; letter-spacing: 0.05em; cursor: pointer;
    transition: all 0.2s; display: flex; align-items: center; gap: 6px;
  }
  .mode-btn.active { background: var(--surface3); color: var(--gold); }

  .editor-area {
    flex: 1; display: flex; overflow: hidden;
  }

  .editor-pane {
    flex: 1; display: flex; flex-direction: column;
    padding: 40px 60px; overflow-y: auto;
  }
  .editor-pane::-webkit-scrollbar { width: 4px; }
  .editor-pane::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .note-title-input {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.4rem; font-weight: 600; color: var(--text);
    background: transparent; border: none; outline: none;
    width: 100%; margin-bottom: 6px; letter-spacing: -0.02em; line-height: 1.2;
  }
  .note-title-input::placeholder { color: var(--text3); }

  .note-meta {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 28px; padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .meta-badge {
    display: flex; align-items: center; gap: 5px;
    font-size: 0.68rem; color: var(--text3); letter-spacing: 0.05em;
  }

  .tag-selector {
    display: flex; gap: 6px; align-items: center;
  }
  .tag-pill {
    padding: 3px 10px; border-radius: 20px; font-size: 0.65rem;
    font-weight: 500; letter-spacing: 0.08em; cursor: pointer;
    border: 1px solid transparent; transition: all 0.2s;
    text-transform: uppercase;
  }
  .tag-pill:hover, .tag-pill.selected {
    transform: scale(1.05);
  }
  .tp-code { border-color: var(--blue); color: var(--blue); }
  .tp-code.selected { background: rgba(107,163,224,0.15); }
  .tp-normal { border-color: var(--gold); color: var(--gold); }
  .tp-normal.selected { background: rgba(201,169,110,0.12); }
  .tp-idea { border-color: var(--accent2); color: var(--accent2); }
  .tp-idea.selected { background: rgba(155,125,224,0.15); }
  .tp-important { border-color: var(--red); color: var(--red); }
  .tp-important.selected { background: rgba(224,107,107,0.15); }

  /* Normal editor */
  .normal-editor {
    flex: 1; outline: none; min-height: 400px;
    font-family: 'Outfit', sans-serif; font-size: 0.95rem;
    color: var(--text2); line-height: 1.85; caret-color: var(--gold);
    word-break: break-word;
  }
  .normal-editor:empty::before {
    content: attr(data-placeholder);
    color: var(--text3); pointer-events: none;
    font-style: italic;
  }
  .normal-editor h1, .normal-editor h2, .normal-editor h3 {
    font-family: 'Cormorant Garamond', serif;
    color: var(--text); margin: 1rem 0 0.5rem; font-weight: 600;
  }
  .normal-editor h1 { font-size: 1.8rem; }
  .normal-editor h2 { font-size: 1.4rem; }
  .normal-editor h3 { font-size: 1.1rem; }
  .normal-editor strong { color: var(--text); }
  .normal-editor em { color: var(--gold2); font-style: italic; }
  .normal-editor ul, .normal-editor ol { padding-left: 1.5rem; margin: 0.5rem 0; }
  .normal-editor li { margin: 4px 0; }
  .normal-editor blockquote {
    border-left: 3px solid var(--gold); padding-left: 16px;
    margin: 1rem 0; color: var(--text3); font-style: italic;
    font-family: 'Cormorant Garamond', serif; font-size: 1.05rem;
  }
  .normal-editor hr { border: none; border-top: 1px solid var(--border2); margin: 1.5rem 0; }
  .normal-editor a { color: var(--accent2); text-decoration: underline; text-decoration-color: rgba(155,125,224,0.4); }

  /* Code editor */
  .code-editor-wrap { flex: 1; display: flex; flex-direction: column; gap: 0; }
  .code-lang-bar {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface3); border-radius: 10px 10px 0 0;
    padding: 8px 16px; border: 1px solid var(--border);
    border-bottom: none;
  }
  .lang-dots { display: flex; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-r { background: #e06b6b; } .dot-y { background: var(--gold); } .dot-g { background: var(--green); }
  .lang-label {
    font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
    color: var(--text3); margin-left: 4px; letter-spacing: 0.1em;
  }
  .lang-select {
    margin-left: auto; background: var(--surface2);
    border: 1px solid var(--border); color: var(--text2);
    font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
    padding: 4px 10px; border-radius: 6px; outline: none; cursor: pointer;
  }
  .lang-select option { background: var(--surface); }

  .code-textarea {
    flex: 1; min-height: 380px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 0 0 10px 10px;
    outline: none; resize: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem; color: var(--green); line-height: 1.7;
    padding: 20px 24px; caret-color: var(--gold);
    tab-size: 2; letter-spacing: 0.02em;
  }
  .code-textarea::placeholder { color: var(--text3); }
  .code-textarea::-webkit-scrollbar { width: 4px; }
  .code-textarea::-webkit-scrollbar-thumb { background: var(--border2); }

  /* LINE NUMBERS */
  .code-wrap { display: flex; flex: 1; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 0 0 10px 10px; overflow: hidden; }
  .line-nums {
    background: var(--surface); padding: 20px 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.82rem;
    color: var(--text3); line-height: 1.7; text-align: right;
    user-select: none; min-width: 48px; border-right: 1px solid var(--border);
  }

  /* INFO PANEL (right side) */
  .info-panel {
    width: 220px; border-left: 1px solid var(--border);
    background: var(--surface); padding: 24px 16px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 20px;
  }
  .info-section-title {
    font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--text3); font-weight: 500; margin-bottom: 10px;
  }
  .stat-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; border-bottom: 1px solid var(--border);
    font-size: 0.72rem; color: var(--text2);
  }
  .stat-val { color: var(--gold); font-weight: 500; font-family: 'JetBrains Mono', monospace; }

  .ai-btn {
    width: 100%; padding: 10px; border-radius: 10px;
    background: linear-gradient(135deg, rgba(124,92,191,0.3) 0%, rgba(201,169,110,0.2) 100%);
    border: 1px solid rgba(155,125,224,0.3); color: var(--accent2);
    font-family: 'Outfit', sans-serif; font-size: 0.72rem; font-weight: 500;
    cursor: pointer; transition: all 0.3s; letter-spacing: 0.05em;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .ai-btn:hover { border-color: var(--accent2); background: rgba(155,125,224,0.2); transform: translateY(-1px); }

  .color-palette { display: flex; gap: 6px; flex-wrap: wrap; }
  .color-dot {
    width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: all 0.2s;
  }
  .color-dot:hover, .color-dot.active { border-color: var(--text); transform: scale(1.2); }

  .checklist { display: flex; flex-direction: column; gap: 6px; }
  .check-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.72rem; color: var(--text2); cursor: pointer;
  }
  .check-item input[type=checkbox] { accent-color: var(--gold); width: 13px; height: 13px; }
  .check-item.done { text-decoration: line-through; color: var(--text3); }

  /* STATUS BAR */
  .statusbar {
    padding: 6px 24px; border-top: 1px solid var(--border);
    background: rgba(18,16,26,0.9); backdrop-filter: blur(20px);
    display: flex; align-items: center; gap: 20px;
    font-size: 0.62rem; color: var(--text3); letter-spacing: 0.05em;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* TOAST */
  .toast {
    position: fixed; bottom: 40px; right: 40px;
    background: var(--surface2); border: 1px solid var(--gold);
    color: var(--gold); padding: 12px 20px; border-radius: 10px;
    font-size: 0.75rem; font-weight: 500; letter-spacing: 0.05em;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5); z-index: 1000;
    transform: translateY(80px); opacity: 0;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px); z-index: 100;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 16px; padding: 32px; width: 440px;
    box-shadow: var(--shadow); transform: scale(0.95);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .modal-overlay.open .modal { transform: scale(1); }
  .modal-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem; font-weight: 600; color: var(--text); margin-bottom: 6px;
  }
  .modal-sub { font-size: 0.75rem; color: var(--text3); margin-bottom: 24px; }
  .modal-input {
    width: 100%; padding: 12px 16px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); outline: none;
    font-family: 'Outfit', sans-serif; font-size: 0.85rem;
    margin-bottom: 12px; transition: border-color 0.2s;
  }
  .modal-input:focus { border-color: var(--gold); }
  .modal-btns { display: flex; gap: 10px; margin-top: 8px; }
  .modal-btn {
    flex: 1; padding: 11px; border-radius: 10px;
    font-family: 'Outfit', sans-serif; font-size: 0.8rem; font-weight: 500;
    cursor: pointer; transition: all 0.2s; border: 1px solid;
  }
  .btn-cancel { background: transparent; border-color: var(--border2); color: var(--text2); }
  .btn-cancel:hover { border-color: var(--text2); }
  .btn-create {
    background: linear-gradient(135deg, var(--gold) 0%, var(--accent2) 100%);
    border-color: transparent; color: #0b0a0f; font-weight: 600;
  }
  .btn-create:hover { opacity: 0.9; transform: translateY(-1px); }

  /* ANIMATIONS */
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
  .note-item { animation: fadeIn 0.25s ease; }

  /* Scrollbar for editor */
  .editor-pane::-webkit-scrollbar { width: 4px; }

  /* Empty state */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    color: var(--text3);
  }
  .empty-icon { font-size: 3rem; opacity: 0.3; }
  .empty-text { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; }
  .empty-sub { font-size: 0.75rem; color: var(--text3); }

  /* Splitter */
  .resizer {
    width: 4px; background: var(--border); cursor: col-resize;
    transition: background 0.2s;
  }
  .resizer:hover { background: var(--gold); }

  /* Tooltip */
  [data-tip] { position: relative; }
  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 6px); left: 50%;
    transform: translateX(-50%); background: var(--surface3);
    color: var(--text); font-size: 0.65rem; white-space: nowrap;
    padding: 4px 8px; border-radius: 6px; pointer-events: none;
    border: 1px solid var(--border2); z-index: 99;
  }

  /* Folded note decoration */
  .note-item::after {
    content: ''; position: absolute; right: 0; top: 0;
    border: 0 solid transparent; transition: all 0.2s;
  }
  .note-item.active::after {
    border-width: 10px; border-right-color: var(--gold);
    border-top-color: var(--gold); border-radius: 0 10px 0 0;
  }
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="logo">
    <div class="logo-text">NOTEX</div>
    <div class="logo-sub">Premium Note Studio</div>
  </div>

  <div class="sidebar-section">
    <button class="new-note-btn" onclick="openModal()">
      <span>＋</span> New Note
    </button>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Search notes…" oninput="searchNotes(this.value)" id="searchInput">
    </div>
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="filterNotes('all', this)">All</button>
      <button class="filter-tab" onclick="filterNotes('code', this)">Code</button>
      <button class="filter-tab" onclick="filterNotes('normal', this)">Notes</button>
      <button class="filter-tab" onclick="filterNotes('idea', this)">Ideas</button>
    </div>
    <div class="section-label">My Notes</div>
  </div>

  <div class="notes-list" id="notesList"></div>

  <div class="sidebar-bottom">
    <button class="sb-btn" data-tip="Settings" onclick="showToast('Settings coming soon ✨')">⚙️</button>
    <button class="sb-btn" data-tip="Export All" onclick="exportAll()">📤</button>
    <button class="sb-btn" data-tip="Theme" onclick="showToast('Luxury Dark — the only theme you need 🖤')">🎨</button>
    <button class="sb-btn" data-tip="Sync" onclick="showToast('Notes saved locally ✓')">☁️</button>
  </div>
</aside>

<!-- MAIN -->
<main class="main" id="mainArea">
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">📝</div>
    <div class="empty-text">No note selected</div>
    <div class="empty-sub">Create a new note or select one from the sidebar</div>
    <button class="new-note-btn" style="width:auto;margin-top:8px;" onclick="openModal()">＋ Create First Note</button>
  </div>
</main>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title">New Note</div>
    <div class="modal-sub">Choose a type and give it a title</div>
    <input class="modal-input" id="modalTitle" placeholder="Note title…" onkeydown="if(event.key==='Enter')createNote()">
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
      <div class="tag-pill tp-normal selected" id="mt-normal" onclick="selectModalType('normal')">📝 Normal</div>
      <div class="tag-pill tp-code" id="mt-code" onclick="selectModalType('code')">💻 Code</div>
      <div class="tag-pill tp-idea" id="mt-idea" onclick="selectModalType('idea')">💡 Idea</div>
      <div class="tag-pill tp-important" id="mt-important" onclick="selectModalType('important')">🔥 Important</div>
    </div>
    <div class="modal-btns">
      <button class="modal-btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-btn btn-create" onclick="createNote()">Create Note →</button>
    </div>
  </div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem('notex_notes') || '[]');
let activeId = null;
let modalType = 'normal';
let currentFilter = 'all';
let saveTimer = null;

// Sample notes if empty
if (notes.length === 0) {
  notes = [
    {
      id: 1, title: 'Welcome to NOTEX ✨', type: 'normal', pinned: true,
      content: '<p>Welcome to <strong>NOTEX</strong> — your premium note-taking studio.</p><h2>Features</h2><ul><li>Rich text editing</li><li>Code notes with syntax support</li><li>Auto-save to browser storage</li><li>Tags &amp; filtering</li><li>Word count &amp; statistics</li></ul><blockquote>Capture ideas. Write beautifully. Stay organized.</blockquote>',
      created: Date.now(), updated: Date.now(), color: '#c9a96e'
    },
    {
      id: 2, title: 'JavaScript Snippets', type: 'code', pinned: false,
      content: `// Debounce function\nfunction debounce(fn, delay) {\n  let timer;\n  return function(...args) {\n    clearTimeout(timer);\n    timer = setTimeout(() => fn.apply(this, args), delay);\n  };\n}\n\n// Async fetch wrapper\nasync function api(url, opts = {}) {\n  const res = await fetch(url, opts);\n  if (!res.ok) throw new Error(res.statusText);\n  return res.json();\n}`,
      lang: 'javascript', created: Date.now() - 3600000, updated: Date.now() - 3600000, color: '#6ba3e0'
    },
    {
      id: 3, title: 'Project Ideas 💡', type: 'idea', pinned: false,
      content: '<p>Ideas for this quarter:</p><ul><li>Build a personal finance dashboard</li><li>AI-powered journal app</li><li>Minimal blog with dark mode</li></ul><p>Prioritize based on <em>impact vs effort</em> matrix.</p>',
      created: Date.now() - 7200000, updated: Date.now() - 7200000, color: '#9b7de0'
    }
  ];
  save();
}

function save() {
  localStorage.setItem('notex_notes', JSON.stringify(notes));
}

function renderSidebar(filter = 'all', query = '') {
  const list = document.getElementById('notesList');
  let filtered = notes.filter(n => {
    const matchFilter = filter === 'all' || n.type === filter;
    const matchQuery = !query || n.title.toLowerCase().includes(query) || (n.content||'').toLowerCase().includes(query);
    return matchFilter && matchQuery;
  });
  // Pinned first
  filtered.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
  list.innerHTML = '';
  if (!filtered.length) {
    list.innerHTML = '<div style="padding:20px 14px;font-size:0.72rem;color:var(--text3);text-align:center;">No notes found</div>';
    return;
  }
  filtered.forEach(n => {
    const d = document.createElement('div');
    d.className = 'note-item' + (n.id === activeId ? ' active' : '') + (n.pinned ? ' pinned' : '');
    d.onclick = () => openNote(n.id);
    const preview = n.type === 'code' ? (n.content || '').split('\n')[0] : (n.content || '').replace(/<[^>]+>/g,'').slice(0,60);
    const tagMap = { code:'tag-code', normal:'tag-normal', idea:'tag-idea', important:'tag-important' };
    const tagLabels = { code:'💻 Code', normal:'📝 Note', idea:'💡 Idea', important:'🔥 Important' };
    const timeAgo = formatDate(n.updated);
    d.innerHTML = `
      <span class="pin-icon">📌</span>
      <div class="note-item-tag ${tagMap[n.type]}">${tagLabels[n.type]}</div>
      <div class="note-item-title">${n.title}</div>
      <div class="note-item-preview">${preview || 'Empty note'}</div>
      <div class="note-item-date">${timeAgo}</div>`;
    list.appendChild(d);
  });
}

function formatDate(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return 'Just now';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
  return new Date(ts).toLocaleDateString();
}

function openNote(id) {
  activeId = id;
  const note = notes.find(n => n.id === id);
  renderSidebar(currentFilter, document.getElementById('searchInput').value);

  const main = document.getElementById('mainArea');
  document.getElementById('emptyState')?.remove();

  if (note.type === 'code') {
    main.innerHTML = buildCodeEditor(note);
    const ta = document.getElementById('codeContent');
    ta.value = note.content || '';
    ta.addEventListener('input', () => { autoSave(id, null, ta.value); updateLineNums(); updateStats(); });
    updateLineNums();
  } else {
    main.innerHTML = buildNormalEditor(note);
    const editor = document.getElementById('noteBody');
    editor.innerHTML = note.content || '';
    editor.addEventListener('input', () => { autoSave(id, editor.innerHTML, null); updateStats(); });
  }
  updateStats();
}

function buildNormalEditor(note) {
  return `
  <div class="toolbar">
    <div class="toolbar-group">
      <button class="tool-btn" data-tip="Bold" onclick="fmt('bold')" title="Bold"><b>B</b></button>
      <button class="tool-btn" data-tip="Italic" onclick="fmt('italic')" title="Italic"><i>I</i></button>
      <button class="tool-btn" data-tip="Underline" onclick="fmt('underline')" title="Underline"><u>U</u></button>
      <button class="tool-btn" data-tip="Strike" onclick="fmt('strikeThrough')" title="Strike"><s>S</s></button>
    </div>
    <div class="toolbar-group">
      <button class="tool-btn" onclick="fmt('formatBlock','h1')" title="H1">H1</button>
      <button class="tool-btn" onclick="fmt('formatBlock','h2')" title="H2">H2</button>
      <button class="tool-btn" onclick="fmt('formatBlock','h3')" title="H3">H3</button>
    </div>
    <div class="toolbar-group">
      <button class="tool-btn" onclick="fmt('insertUnorderedList')" title="List">≡</button>
      <button class="tool-btn" onclick="fmt('insertOrderedList')" title="Numbered">①</button>
      <button class="tool-btn" onclick="fmt('formatBlock','blockquote')" title="Quote">"</button>
      <button class="tool-btn" onclick="fmt('insertHorizontalRule')" title="Divider">—</button>
    </div>
    <div class="toolbar-group">
      <button class="tool-btn" onclick="fmt('justifyLeft')" title="Left">⬅</button>
      <button class="tool-btn" onclick="fmt('justifyCenter')" title="Center">↔</button>
      <button class="tool-btn" onclick="fmt('justifyRight')" title="Right">➡</button>
    </div>
    <div class="toolbar-group">
      <button class="tool-btn" onclick="addLink()" title="Link">🔗</button>
      <button class="tool-btn" onclick="fmt('removeFormat')" title="Clear">✕</button>
    </div>
    <div style="display:flex;gap:6px;align-items:center;margin-left:8px;">
      <button class="tool-btn" onclick="togglePin(${note.id})" title="${note.pinned?'Unpin':'Pin'}" id="pinBtn">${note.pinned?'📌':'📍'}</button>
      <button class="tool-btn" onclick="deleteNote(${note.id})" title="Delete" style="color:var(--red)">🗑</button>
    </div>
    <div class="mode-toggle" style="margin-left:auto;">
      <button class="mode-btn active">📝 Normal</button>
    </div>
  </div>
  <div class="editor-area">
    <div class="editor-pane">
      <input class="note-title-input" value="${note.title}" placeholder="Untitled Note"
        oninput="updateTitle(${note.id}, this.value)">
      <div class="note-meta">
        <span class="meta-badge">📅 ${new Date(note.created).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</span>
        <span class="meta-badge" id="wordCountBadge">💬 0 words</span>
        <div class="tag-selector">
          <div class="tag-pill tp-normal ${note.type==='normal'?'selected':''}" onclick="changeType(${note.id},'normal')">📝</div>
          <div class="tag-pill tp-idea ${note.type==='idea'?'selected':''}" onclick="changeType(${note.id},'idea')">💡</div>
          <div class="tag-pill tp-important ${note.type==='important'?'selected':''}" onclick="changeType(${note.id},'important')">🔥</div>
        </div>
      </div>
      <div class="normal-editor" id="noteBody" contenteditable="true"
        data-placeholder="Start writing your note… Use the toolbar for formatting."></div>
    </div>
    ${buildInfoPanel(note)}
  </div>
  <div class="statusbar">
    <div class="status-dot"></div>
    <span>Auto-saved</span>
    <span>|</span>
    <span id="charCount">0 chars</span>
    <span>|</span>
    <span>Normal Note</span>
    <span style="margin-left:auto;">NOTEX v2.0</span>
  </div>`;
}

function buildCodeEditor(note) {
  const langs = ['javascript','python','html','css','typescript','java','c','cpp','rust','go','sql','bash','json','markdown'];
  const sel = langs.map(l => `<option value="${l}" ${(note.lang||'javascript')===l?'selected':''}>${l}</option>`).join('');
  return `
  <div class="toolbar">
    <div class="toolbar-group">
      <button class="tool-btn" onclick="copyCode()" title="Copy">📋 Copy</button>
      <button class="tool-btn" onclick="clearCode()" title="Clear" style="color:var(--red)">🗑 Clear</button>
      <button class="tool-btn" onclick="downloadCode()" title="Download">⬇ Download</button>
    </div>
    <div class="toolbar-group">
      <button class="tool-btn" onclick="togglePin(${note.id})" title="Pin" id="pinBtn">${note.pinned?'📌':'📍'}</button>
      <button class="tool-btn" onclick="deleteNote(${note.id})" title="Delete" style="color:var(--red)">🗑</button>
    </div>
    <div class="mode-toggle" style="margin-left:auto;">
      <button class="mode-btn active">💻 Code</button>
    </div>
  </div>
  <div class="editor-area">
    <div class="editor-pane" style="padding:28px 32px;">
      <input class="note-title-input" value="${note.title}" placeholder="Code Snippet Title"
        oninput="updateTitle(${note.id}, this.value)">
      <div class="note-meta">
        <span class="meta-badge">📅 ${new Date(note.created).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</span>
        <span class="meta-badge" id="wordCountBadge">📄 0 lines</span>
      </div>
      <div class="code-editor-wrap">
        <div class="code-lang-bar">
          <div class="lang-dots">
            <div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div>
          </div>
          <span class="lang-label">CODE EDITOR</span>
          <select class="lang-select" id="langSelect" onchange="changeLang(${note.id}, this.value)">${sel}</select>
        </div>
        <div class="code-wrap">
          <div class="line-nums" id="lineNums">1</div>
          <textarea class="code-textarea" id="codeContent" placeholder="// Write your code here…" spellcheck="false"
            onkeydown="handleTab(event)"></textarea>
        </div>
      </div>
    </div>
    ${buildInfoPanel(note)}
  </div>
  <div class="statusbar">
    <div class="status-dot"></div>
    <span>Auto-saved</span>
    <span>|</span>
    <span id="charCount">0 chars</span>
    <span>|</span>
    <span id="langLabel">${note.lang||'javascript'}</span>
    <span style="margin-left:auto;">NOTEX v2.0</span>
  </div>`;
}

function buildInfoPanel(note) {
  return `
  <div class="info-panel">
    <div>
      <div class="info-section-title">Statistics</div>
      <div class="stat-item"><span>Words</span><span class="stat-val" id="statWords">0</span></div>
      <div class="stat-item"><span>Characters</span><span class="stat-val" id="statChars">0</span></div>
      <div class="stat-item"><span>Lines</span><span class="stat-val" id="statLines">0</span></div>
      <div class="stat-item"><span>Read time</span><span class="stat-val" id="statRead">0m</span></div>
    </div>
    <div>
      <div class="info-section-title">Note Color</div>
      <div class="color-palette">
        ${['#c9a96e','#9b7de0','#6ba3e0','#5ecfb1','#e06b6b','#e0a76b','#ffffff'].map(c =>
          `<div class="color-dot ${note.color===c?'active':''}" style="background:${c}" onclick="setColor(${note.id},'${c}')"></div>`
        ).join('')}
      </div>
    </div>
    <div>
      <div class="info-section-title">Quick Actions</div>
      <button class="ai-btn" onclick="showToast('✨ AI Summary: Your note looks great!')">✨ AI Summarize</button>
      <button class="ai-btn" style="margin-top:8px;" onclick="exportNote(${note.id})">📤 Export Note</button>
      <button class="ai-btn" style="margin-top:8px;" onclick="duplicateNote(${note.id})">📋 Duplicate</button>
    </div>
    <div>
      <div class="info-section-title">Checklist</div>
      <div class="checklist" id="checklist">
        ${(note.checks||[]).map((c,i)=>`
          <label class="check-item ${c.done?'done':''}">
            <input type="checkbox" ${c.done?'checked':''} onchange="toggleCheck(${note.id},${i},this.checked)">
            ${c.text}
          </label>`).join('')}
        <button onclick="addCheck(${note.id})" style="font-size:0.65rem;color:var(--text3);background:transparent;border:none;cursor:pointer;text-align:left;margin-top:4px;">＋ Add item</button>
      </div>
    </div>
  </div>`;
}

function fmt(cmd, val) {
  document.execCommand(cmd, false, val || null);
  document.getElementById('noteBody')?.focus();
}

function addLink() {
  const url = prompt('Enter URL:');
  if (url) document.execCommand('createLink', false, url);
}

function updateStats() {
  const note = notes.find(n => n.id === activeId);
  if (!note) return;
  let text = '';
  if (note.type === 'code') {
    const ta = document.getElementById('codeContent');
    text = ta ? ta.value : '';
  } else {
    const body = document.getElementById('noteBody');
    text = body ? body.innerText : '';
  }
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const chars = text.length;
  const lines = text.split('\n').length;
  const readMin = Math.max(1, Math.ceil(words / 200));
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  set('statWords', words);
  set('statChars', chars);
  set('statLines', lines);
  set('statRead', readMin + 'm');
  set('charCount', chars + ' chars');
  set('wordCountBadge', note.type === 'code' ? `📄 ${lines} lines` : `💬 ${words} words`);
}

function updateLineNums() {
  const ta = document.getElementById('codeContent');
  const ln = document.getElementById('lineNums');
  if (!ta || !ln) return;
  const lines = ta.value.split('\n').length;
  ln.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('<br>');
  ln.scrollTop = ta.scrollTop;
}

function handleTab(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const s = ta.selectionStart, en = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(en);
    ta.selectionStart = ta.selectionEnd = s + 2;
    updateLineNums();
  }
}

function autoSave(id, html, code) {
  clearTimeout(saveTimer);
  const note = notes.find(n => n.id === id);
  if (!note) return;
  if (html !== null) note.content = html;
  if (code !== null) note.content = code;
  note.updated = Date.now();
  saveTimer = setTimeout(() => { save(); renderSidebar(currentFilter, document.getElementById('searchInput').value); }, 600);
}

function updateTitle(id, val) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  note.title = val; note.updated = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { save(); renderSidebar(currentFilter, document.getElementById('searchInput').value); }, 600);
}

function changeLang(id, lang) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  note.lang = lang; note.updated = Date.now();
  const ll = document.getElementById('langLabel');
  if (ll) ll.textContent = lang;
  save();
}

function changeType(id, type) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  note.type = type; note.updated = Date.now();
  save(); openNote(id);
}

function setColor(id, color) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  note.color = color; save(); openNote(id);
  showToast('Note color updated ✓');
}

function togglePin(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  note.pinned = !note.pinned; save();
  const btn = document.getElementById('pinBtn');
  if (btn) btn.textContent = note.pinned ? '📌' : '📍';
  renderSidebar(currentFilter, document.getElementById('searchInput').value);
  showToast(note.pinned ? 'Note pinned 📌' : 'Note unpinned');
}

function deleteNote(id) {
  if (!confirm('Delete this note?')) return;
  notes = notes.filter(n => n.id !== id);
  save(); activeId = null;
  const main = document.getElementById('mainArea');
  main.innerHTML = `<div class="empty-state" id="emptyState">
    <div class="empty-icon">📝</div>
    <div class="empty-text">No note selected</div>
    <div class="empty-sub">Create a new note or select one from the sidebar</div>
    <button class="new-note-btn" style="width:auto;margin-top:8px;" onclick="openModal()">＋ Create First Note</button>
  </div>`;
  renderSidebar(currentFilter);
  showToast('Note deleted 🗑');
}

function duplicateNote(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  const copy = { ...JSON.parse(JSON.stringify(note)), id: Date.now(), title: note.title + ' (copy)', pinned: false, created: Date.now(), updated: Date.now() };
  notes.unshift(copy); save(); renderSidebar(currentFilter);
  showToast('Note duplicated 📋');
}

function exportNote(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  const content = note.type === 'code' ? note.content : note.content.replace(/<[^>]+>/g, '');
  const blob = new Blob([`${note.title}\n${'─'.repeat(40)}\n\n${content}`], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = note.title.replace(/[^a-z0-9]/gi, '_') + (note.type === 'code' ? '.txt' : '.txt');
  a.click();
  showToast('Note exported 📤');
}

function exportAll() {
  const all = notes.map(n => `${n.title}\n${'─'.repeat(40)}\n${(n.content||'').replace(/<[^>]+>/g,'')}`).join('\n\n\n');
  const blob = new Blob([all], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'notex_export.txt'; a.click();
  showToast('All notes exported 📤');
}

function copyCode() {
  const ta = document.getElementById('codeContent');
  if (!ta) return;
  navigator.clipboard.writeText(ta.value).then(() => showToast('Code copied 📋'));
}

function clearCode() {
  const ta = document.getElementById('codeContent');
  if (!ta) return;
  if (confirm('Clear code?')) { ta.value = ''; updateLineNums(); autoSave(activeId, null, ''); }
}

function downloadCode() {
  const note = notes.find(n => n.id === activeId);
  const ta = document.getElementById('codeContent');
  if (!ta || !note) return;
  const exts = { javascript:'js', python:'py', html:'html', css:'css', typescript:'ts', java:'java', c:'c', cpp:'cpp', rust:'rs', go:'go', sql:'sql', bash:'sh', json:'json', markdown:'md' };
  const ext = exts[note.lang || 'javascript'] || 'txt';
  const blob = new Blob([ta.value], { type: 'text/plain' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = note.title.replace(/[^a-z0-9]/gi,'_') + '.' + ext; a.click();
  showToast('Code downloaded ⬇');
}

function addCheck(id) {
  const text = prompt('Checklist item:');
  if (!text) return;
  const note = notes.find(n => n.id === id);
  if (!note) return;
  note.checks = note.checks || [];
  note.checks.push({ text, done: false });
  save(); openNote(id);
}

function toggleCheck(id, idx, done) {
  const note = notes.find(n => n.id === id);
  if (!note || !note.checks) return;
  note.checks[idx].done = done; save();
  const label = document.querySelectorAll('.check-item')[idx];
  if (label) label.classList.toggle('done', done);
}

function openModal() {
  modalType = 'normal';
  document.getElementById('modalTitle').value = '';
  document.querySelectorAll('.modal .tag-pill').forEach(p => p.classList.remove('selected'));
  document.getElementById('mt-normal').classList.add('selected');
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('modalTitle').focus(), 100);
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

function selectModalType(type) {
  modalType = type;
  document.querySelectorAll('.modal .tag-pill').forEach(p => p.classList.remove('selected'));
  document.getElementById('mt-' + type).classList.add('selected');
}

function createNote() {
  const title = document.getElementById('modalTitle').value.trim() || 'Untitled Note';
  const note = {
    id: Date.now(), title, type: modalType, pinned: false,
    content: modalType === 'code' ? '' : '', lang: 'javascript',
    created: Date.now(), updated: Date.now(), color: '#c9a96e', checks: []
  };
  notes.unshift(note); save(); closeModal();
  renderSidebar(currentFilter); openNote(note.id);
  showToast('Note created ✨');
}

function filterNotes(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderSidebar(filter, document.getElementById('searchInput').value);
}

function searchNotes(query) {
  renderSidebar(currentFilter, query.toLowerCase());
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// Init
renderSidebar();
if (notes.length) openNote(notes[0].id);
</script>
