<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal - Brain Bee Bangladesh 2026</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-warm-white: #FAFAF7;
      --bg-cream: #F5F0E8;
      --bg-card: #FFFFFF;
      --gold-primary: #C9972C;
      --gold-vibrant: #D4A832;
      --text-primary: #2C2C2C;
      --text-body: #6B6258;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, var(--bg-cream) 0%, var(--bg-warm-white) 100%);
      color: var(--text-primary);
    }

    h1, h2 { font-family: 'Playfair Display', serif; }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      height: 72px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(201, 153, 44, 0.15);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .nav-hex {
      width: 24px;
      height: 24px;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background: var(--gold-primary);
    }

    .logo-small {
      width: 40px;
      height: 40px;
      object-fit: contain;
      object-position: center;
    }

    main {
      margin-top: 72px;
      min-height: 100vh;
      padding: 60px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 2rem;
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-vibrant));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 3rem;
      box-shadow: 0 2px 12px rgba(160, 130, 60, 0.08);
      border: 1px solid rgba(201, 153, 44, 0.1);
      margin: 2rem auto;
      max-width: 600px;
    }

    .card p {
      color: var(--text-body);
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-vibrant));
      color: white;
      border: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(201, 153, 44, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(201, 153, 44, 0.4);
    }

    footer {
      background: var(--bg-cream);
      border-top: 1px solid rgba(201, 153, 44, 0.2);
      padding: 40px 20px;
      text-align: center;
      color: var(--text-body);
      margin-top: 60px;
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <img src="assets/bbb.png" alt="Brain Bee Bangladesh" class="logo-small">
        Brain Bee BD
      </a>
    </div>
  </nav>

  <main>
    <div class="container">
      <h1>Portal</h1>
      
      <div class="card">
        <p>Welcome to the Brain Bee Bangladesh Portal. Coming soon with more features!</p>
        <p style="font-size: 0.95rem; color: var(--text-body); margin-bottom: 1.5rem;">
          For now, you can register, check your dashboard, or return to the main page.
        </p>
        <a href="register.html" class="btn">Register Now →</a>
      </div>
    </div>
  </main>

  <footer>
    <p style="font-size: 0.9rem;">© 2026 Brain Bee Bangladesh. All rights reserved.</p>
  </footer>
</body>
</html>
